required_inputs:
- 'EVD-0020 + docs/reviews/2026-08-12-bug0017-live-confirm.md: the live pilot proved
  the TSK-0053 WORDING fix is insufficient. With the fixed entry file deployed, the
  /hooks ceremony is GONE at the restart message itself, but RETURNS on the continuation
  path (Turn 2): the entry session did not stop, the agent initiated the scope-approval
  flow, the mint FAILED (kit hooks inactive in the entry session), and the agent RE-INVENTED
  /hooks from that failure.'
- 'ARCHITECTURE: the only enforcement active in the entry session is user/claude/hooks/handover_guard.py
  (BUG-0016 / DEC-0032, registered in ~/.claude/settings.json, marker-gated on .claude/HANDOVER_PENDING).
  Freshly installed KIT hooks are inactive until restart (settings-watcher gap), so
  the fix CANNOT live in team-kits/ -- it must live in the global guard. The guard
  today refuses product writes, spawns, and driving the work engine on the shell (harness.py/kernel.cli
  non-read), but explicitly ALLOWS asking/answering -- which is the gap the approval
  flow slips through.'
- 'The approval flow and its mint: the kit mints an approval via a PostToolUse hook
  on the AskUserQuestion answer (marker like [APR-REQ:...] / option ''Freigeben [<code>]''),
  which is inactive in the entry session. Measure the EXACT initiation path in the
  entry session before building.'
expected_outputs:
- 'STEP 1 MEASURE (do not guess): with .claude/HANDOVER_PENDING present, how does
  the entry session initiate the scope-approval flow -- via an AskUserQuestion carrying
  the approval-request marker ([APR-REQ:...]), via `harness.py/kernel.cli request-approval`
  on the shell, or both? Does handover_guard.py currently fire on each? (harness.py
  request-approval SHOULD already be refused by _segment_drives_engine -- confirm;
  the AskUserQuestion path is the suspected gap since asking is allowed.) Report the
  measured initiation path.'
- 'STEP 2 FIX in user/claude/hooks/handover_guard.py: structurally prevent the entry
  session from INITIATING the scope-approval flow while the marker is present -- refuse
  the measured initiation path(s). If it is the AskUserQuestion approval-request,
  add a narrow refusal keyed on the approval-request marker in the tool_input (NOT
  a blanket ban on AskUserQuestion -- keep the soft-variant: normal asking/answering/reading/plan-refinement
  stay allowed). The refusal MESSAGE must (a) say scope approval is requested and
  minted by the PM AFTER restart, and (b) EXPLICITLY say do NOT run /hooks -- there
  is none; only restart. Preserve the guard''s fail-open philosophy and its existing
  refusals. Keep the module docstring honest (no claimed protection the code does
  not build; name any residue).'
- 'STEP 3 TEST (tools/, red-without-fix, measure the RUNNING hook): with the marker,
  the approval-request initiation path is REFUSED (rc 2) with the honest message;
  without the marker it is allowed; a NORMAL AskUserQuestion is allowed with or without
  the marker (no over-refusal); existing guard refusals (engine drive, spawn, product
  write) still fire; plan-artefact writes still allowed. Prove red without the new
  rule.'
- 'STEP 4 REPORT: file:line for every change; the measured initiation path; the four
  suite numbers (subset run is fine if the full run is too slow on this host -- say
  which); ruff; and state clearly that BEHAVIOURAL confirmation (entry agent no longer
  invents /hooks on the continuation path) needs a LIVE phase-1 pilot -- the runner
  method is documented in docs/reviews/2026-08-12-bug0017-live-confirm.md. user/claude/
  is NOT a kit-hash input (no VERSION bump) but is deployed to ~/.claude (note it).'
