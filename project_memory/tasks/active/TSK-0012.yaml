expected_outputs:
- Ein Datensatz, der sich mit einer Id ausweist, wird an jeder Stelle gefunden, an
  der ein Datensatz stehen kann -- die Erkennung haengt nicht daran, wo im Dokument
  er steht
- Derselbe Leser antwortet dem Trockenlauf, dem Abschlusskriterium in validate und
  dem Vollstaendigkeitsnachweis; keiner von dreien kann etwas sehen, das die anderen
  nicht sehen
- Eine Groessengrenze wird nur dort geprueft, wo sie auch durchgesetzt wird -- ein
  Datensatz, den kein Leser je an dieser Grenze misst, wird deswegen nicht zurueckgehalten
- Wer aus der Ausgabe erfahren soll, welche Datensaetze einen Menschen brauchen, erfaehrt
  jeden einzelnen, nicht eine Spanne
- Jeder Satz in README und Spec beschreibt, was der Lauf heute tut -- die zweite Archivtuer,
  das Verlassen des Quellbereichs und die Verdikte, die nicht blockieren, kommen darin
  vor
- Jedes Beispiel, mit dem eine Entscheidung im Code begruendet wird, existiert in
  einer ausgelieferten Vorlage oder in gemessenen Daten
- Die Riegel der zweiten Archivtuer und die Klausel, die die Wurzelwarnung richtig
  macht, sind je einzeln durch eine Mutation rot zu bekommen
- Die Warnung, dass ein Projekt nach dem Lauf kein Wurzelitem mehr haelt, nennt die
  Folge und nicht nur den Zustand -- und sie erscheint auch dort, wo geschrieben wird
- volle Suite gruen, ruff sauber, validate sauber, Kits gestempelt, git-Index deckungsgleich
  mit dem Arbeitsbaum
