- Wo ein Verzeichniswechsel in einem Kind der Shell laeuft, bleibt die Basis des Gates
  stehen -- unabhaengig davon, wie die Kindschaft geschrieben ist und wo im Verlauf
  der Zeile sie beginnt
- Die Basis bewegt sich nur dorthin, wo ein Prozess auch wirklich hinkommt -- dass
  ein Ziel benannt werden kann, genuegt nicht
- Die Menge der roten Tests deckt die Eigenschaft, die diese Reparatur verlangt, nicht
  die Liste der Zeilen, die der Pruefer zufaellig gemessen hat
- Jeder Docstring sichert Schutz nur dort zu, wo eine Mutation den zugehoerigen Test
  rot macht; eine Grenze darf er ohne Test benennen, dann aber als Grenze, mit dem
  Eintrag der Loecherliste, der ihre gemessene Kette traegt
- Die Frist, die ein Gate sich zugesteht, und die Frist, nach der es getoetet wird,
  sind zwei verschiedene Dinge -- wo sie auseinanderfallen koennen, steht das als
  Grenze und nicht als Zusicherung
- Jeder Verweis auf ein Messprotokoll fuehrt zu einem Dokument, das die verwiesenen
  Eintraege wirklich traegt
- Ein Eintrag der Loecherliste, dessen Kette gemessen durchlaeuft, traegt kein Urteil,
  das das Gegenteil sagt; und die Spalte, die nennen soll, was an die Stelle des Schutzes
  tritt, bleibt nicht leer
- python -B -m pytest .claude/hooks/test_gates.py -q gruen
