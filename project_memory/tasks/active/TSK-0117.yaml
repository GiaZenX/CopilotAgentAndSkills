expected_outputs:
- 'FR-0074, DEC FIRST: a DEC proposal at project_memory/staging/(this task id)/dec-plan-approval.json
  in the shape of TSK-0106/dec-run-scope.json -- the lead captures it, the USER decides;
  the build follows the decided shape: an approval KIND at plan level covering the
  confirmed product-goal list (hash over the list and each goal''s criteria), after
  which per-goal scope questions are not asked; what REMAINS a question is a PROPERTY
  (irreversible or taste-bound: merge/push, design choices, money, anything the plan
  did not settle), not a list; the delivery side stays per goal (verdicts, evidence,
  merge gates); a goal the team cannot do as planned comes back as a question, not
  an improvisation; the widened control hole is measured and named (hole list or DEC
  consequence). Constitution and PM-skill sentences (planning phase thorough by design,
  own proposals, the remaining-questions property) are a SEAM to stream D, verbatim
  in the protocol.'
- 'FR-0082: EVIDENCE_RESULTS gains ''blocked''; gate_git closes on it like on ''fail'';
  the recorded sentence says WHAT blocked and that nothing was checked; a blocked
  evidence without that sentence is refused by the kernel; the merge reads it (report.py);
  red-first on kernel and on gate_git as a process.'
- 'FR-0083: an approval minted through the Agent SDK canUseTool carries a PROVENANCE
  the kernel reads and prints on the approval card; a gate that requires a human-minted
  token refuses the programmatic one with a sentence; measured against gate_approval.py
  as a process on a pilot outside the repo; the H80 correction (headless is reachable)
  is what this builds on, not the refuted premise; red-first.'
- 'BUG-0089: the frozen-field refusal derives its remedy from AUTOMATA (the edges
  that exist from the current state) -- or a READY -> DRAFT edge is added with its
  index/brief consequences (returned item = re-planned, not new); the test plants
  a state whose automaton has no DRAFT edge and asserts the remedy does not name DRAFT;
  red-first.'
- 'MST seam from stream A (FR-0079): if the user''s DEC says TYPE, the type-definition
  lines arrive from A through the lead during the round and this stream applies them
  in backlog_types.py (automaton, ACTIVE_DIRS, REQUIRED_FIELDS, index) with a test;
  if FIELD, or no DEC before this stream''s handover, nothing is done and the protocol
  says so. Leases/dispatch requirements from stream D (FR-0021) are RECEIVED the same
  way: built only if D delivers a concrete requirement with its test through the lead;
  else listed as not built.'
- Per FR its own red-first test measured in a copy outside the repo (restore the defect,
  see red, put it back) and its own acceptance line in the protocol; the verifier
  reports PER FR (DEC-0062 (4)). Every new property claim -- code comment, docstring,
  docs, hole list -- is MEASURED before handover (the most frequent finding of generation
  2); every hole-list citation carries its module prefix; hole numbers H132 to H134
  ONLY; forbidden_scope project_memory/** excepts project_memory/staging/(this task
  id)/.
- 'Handover: worktree C:/Offline Repos/v2-testbed/_worktrees/g3-approvals (branch
  g3/approvals off feat/harness-v2 at e45c0ca); ALL scratch only under C:/Offline
  Repos/v2-testbed/_round-scratch/(this task id)/; verifier copies made WITHOUT the
  .git file of the worktree; patch = the worktree diff at C:/Offline Repos/v2-testbed/_round-scratch/(this
  task id)/stream-approvals.patch; protocol at project_memory/staging/(this task id)/stream-protocol.md
  with: seam table, per-FR acceptance line + red-first tests, measured lines, what
  was deliberately not closed but named, the one-line rejected alternative of the
  plan (FR-0084 shape), suite runs (affected suites only -- the full suite belongs
  to the merge round), provisional VERSION stamp, wall-clock and tokens for the (g)
  table. No commit, no push, no install to the global store.'
