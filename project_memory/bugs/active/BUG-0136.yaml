id: BUG-0136
title: Vier gemessene Grenzen der Amendment-Ableitung (neu, TSK-0062)
related_pr: PR-0003
observed: 'TSK-0062 (`BUG-0040`) hat die Kriterien freigegebener Änderungsanträge
  in das Dispatch-Universum

  ihrer Wurzel geholt — als Ableitung über vier Terme (`dispatch._amendment_criteria_locked`),
  nicht

  als Sonderfall. Die Prüfung hat den Fix angegriffen und vier Grenzen vermessen;
  keine ist eine

  Angriffskette innerhalb einer Sitzung, und jede steht als benannte Grenze in dem
  Code, der sie hat

  — dieser Eintrag ist die Sammelstelle, damit sie ein Urteil tragen statt nur ein
  Kommentar zu sein.

  Alle Zeilennummern sind der Stand 2026-08-15 (Kits `2026.08.15-7`) und bleiben als
  Fundprotokoll

  stehen.'
severity: low
hole_number: H44
source: docs/holes/H44.md
limits: 'vier gemessene Grenzen der Amendment-Ableitung aus TSK-0062, je im Eintrag:
  die Kriterien eines ANGEWENDETEN Änderungsantrags zählen nicht mehr (Über-Verweigerung,
  per Test festgehalten); die Zugehörigkeit (`target_pr`) ist nicht signiert (durch
  den Kernel geschlossen, offen nur vorbei an ihm — und diese Sitzungstür hält Gate
  1 zu); `target_revision` wird nie als Wert verglichen (leiht ausschließlich nutzersignierten
  Inhalt); Hop 1 bleibt für Nicht-Amendments ohne Freigabeterm (Design, H39 — die
  Amendment-Hälfte ist seit dieser Runde zu)'
