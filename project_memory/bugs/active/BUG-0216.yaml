id: BUG-0216
title: Der SDK-Weg prägt ohne die dritte Bedingung, und jedes Programm, das die Brücke
  ruft, prägt (neu, TSK-0117, FR-0083)
related_pr: PR-0003
observed: '**Mechanismus.** `approvals._assert_minting_caller` kannte eine Route und
  drei Bedingungen: ein

  geladenes `_kernel`-Brückenmodul, der unmittelbare Aufrufer IST die Haken-Datei,
  und `__main__` ist

  dieselbe Datei. Die zweite Route (`kernel/sdk_approval.py`, der Einstieg aus `canUseTool`)
  kann die

  dritte Bedingung nicht tragen: das einbettende Programm IST `__main__`, per Konstruktion.
  Geprüft

  wird dort nur der unmittelbare Aufrufer. Damit prägt jedes Programm, das dieses
  Paket importiert

  und `mint_from_can_use_tool` ruft — ohne Haken, ohne Provider, ohne Nutzer.'
severity: medium
hole_number: H133
source: docs/holes/H133.md
limits: 'die zweite Mint-Route (`kernel/sdk_approval.py`, der Einstieg aus dem Agent-SDK-`canUseTool`)
  kann die dritte Bedingung von `approvals._assert_minting_caller` nicht tragen —
  das einbettende Programm IST `__main__` —, also prägt jedes Programm, das das Paket
  importiert und die Brücke ruft. Gemessen am Piloten: Haken-Route `minted_via: user_answer_via_approval_hook`,
  Brücken-Route `program_answer_via_agent_sdk`, ein fremdes Skript weiterhin verweigert.
  Begrenzt durch: den Stempel auf jedem Datensatz und die Karte, die ihn vorliest;
  die Kernel-Verweigerung jeder Art aus `approvals.IRREVERSIBLE_KINDS` für die Programm-Route
  (an `push` gemessen, danach kein lebendes Token); und `gate_git`, das als Prozess
  jeden Merge über einen so freigegebenen Vorgang verweigert. NICHT begrenzt: der
  vorsätzliche Fälscher, gegen den schon die Haken-Route nichts wert war'
status: TRIAGED
revision: 1
