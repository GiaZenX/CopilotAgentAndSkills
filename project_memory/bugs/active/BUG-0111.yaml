  Kehrseite ist, dass ein Kandidat, der einen Vorfahren nennt — ein einzelnes `..`,
  ein bloßer

  Laufwerksbuchstabe, die Repo-Wurzel selbst —, als Schreibzugriff auf **alles darunter**
  gelesen

  wird. Ein `_PATHISH`-Treffer, der nur aus `/` oder `\` besteht, reicht dafür aus.'
