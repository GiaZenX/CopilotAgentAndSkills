id: BUG-0217
title: '`blocked` ist ein Zustand, keine Messung (neu, TSK-0117, FR-0082)'
related_pr: PR-0003
observed: '**Mechanismus.** `backlog_types.EVIDENCE_RESULTS` kennt seit dieser Runde
  einen dritten Ausgang.

  Der Kernel verlangt zu einem `blocked` den Satz, der sagt, WAS den Lauf verhindert
  hat

  (`state.capture_preflight`), und `gate_git` liest ihn vor und sagt dazu, dass nichts
  geprüft wurde.

  Niemand misst nach, ob der Browser wirklich fehlte. Der Wert macht aus einer Ehrlichkeitspflicht

  einen Zustand; er fügt der Frage „ist das wahr?" nichts hinzu.'
severity: medium
hole_number: H134
source: docs/holes/H134.md
limits: '`blocked` ist ein Zustand und keine Messung: niemand prüft nach, ob der Browser
  wirklich fehlte. Gemessen am Piloten mit dem ausgelieferten `gate_git.py` als Prozess:
  ein `blocked` ohne Satz wird vom Kernel verweigert, mit Satz aufgenommen, und der
  Merge verweigert rc 2 und zitiert den Satz samt „nichts wurde geprüft". Begrenzt
  durch: ein falsches `blocked` kauft nichts (es schließt wie ein `fail`), der Datensatz
  ist unveränderlich, und die Einschränkung steht im Vokabular-Kommentar, in der Hilfe
  der Flagge und in der Verweigerung selbst. NICHT begrenzt: die Wahrheit der Begründung,
  in beide Richtungen'
status: TRIAGED
