id: BUG-0206
title: Der Melder über ungelesene Prosa fragt, was git TRÄGT, und nicht, was auf der
  Platte liegt (neu, TSK-0110, FR-0036)
related_pr: PR-0003
observed: '**Mechanismus.** `test_repo_hygiene.test_docs_prose_nothing_reads_any_more_is_reported_not_failed`

  nennt eine Datei unter `docs/`, die seit `_DOCS_GRACE_DAYS` niemand mehr anfasst
  und die NICHTS

  nennt. Sein Korpus ist `test_repo_hygiene._carried_files`, also

  `git ls-files -c -o --exclude-standard`. Eine ignorierte Datei steht darin nicht.
  Nennt sie ein

  Dokument, sieht der Melder die Nennung nicht und meldet das Dokument als ungelesen.'
severity: low
hole_number: H122
source: docs/holes/H122.md
limits: 'der Melder über ungelesene Prosa unter `docs/` fragt, was **git trägt** (`test_repo_hygiene._carried_files`,
  `git ls-files -c -o --exclude-standard`): eine Nennung in einer IGNORIERTEN Datei
  — ein Laufprotokoll, `project_memory/.audit/`, ein erzeugtes Dashboard — sieht er
  nicht und meldet die Datei als ungelesen. Begrenzt durch: der Docstring des Melders
  sagt genau diesen Satz statt des größeren, der Melder warnt und blockt nie, und
  auf diesem Baum gibt es außerhalb der Werkzeug-Caches keine einzige nicht getragene
  Datei — das blinde Feld ist heute leer'
