id: BUG-0230
title: Welche Datums-Schreibweisen ein Meilenstein annimmt, entscheidet der Interpreter
  (neu, TSK-0117 Nacharbeit 1, DEC-0064)
related_pr: PR-0003
observed: '**Mechanismus.** `state.capture_preflight` prüft ein Datumsfeld mit

  `backlog_types.normalised_date`, und das ist `datetime.date.fromisoformat`. Welche
  Formen diese

  Funktion liest, hat sich über die Python-Versionen erweitert: `2026-10-01` liest
  jede, die kompakte

  Form `20261001` erst 3.11+. Dieselbe Erfassung wird also auf einer Maschine angenommen
  und auf

  einer anderen verweigert, ohne dass irgendetwas im Projekt sich geändert hätte.'
severity: medium
hole_number: H147
source: docs/holes/H147.md
limits: 'welche Datums-Schreibweisen ein `MST` annimmt, entscheidet der Interpreter:
  `backlog_types.normalised_date` ist `date.fromisoformat`, und die liest `20261001`
  erst ab 3.11 — dieselbe Erfassung wird auf einer Maschine angenommen und auf einer
  anderen verweigert. Am Piloten gemessen (3.13): `2026-10-01` und `20261001` angenommen,
  beide gespeichert als `2026-10-01`; `Oktober`, `2026-13-01`, `2026-10-01T00:00`,
  `''''` und `None` verweigert. Begrenzt durch: die WIRKUNG ist weg — was angenommen
  wird, wird normiert gespeichert, also trägt ein Tag genau eine Schreibweise und
  jede Sortierung nach `due` stimmt; die Verweigerung nennt die Form, die überall
  gilt. NICHT begrenzt: dass die Annahme selbst versionsabhängig ist'
regression_tests:
