id: BUG-0234
title: Was eine Option dem Läufer antut, entscheidet kein Text (neu, TSK-0121; nach
  Prüfung 1 und 2 korrigiert)
related_pr: PR-0003
observed: '**Mechanismus.** „Diese Zeile fährt die ganze erklärte Fläche" ist als
  Eigenschaft gebaut, mit

  genau einer unvermeidbaren Aufzählung: welche Optionen der Läufer so liest, dass
  die Zeile die

  Fläche NICHT mehr ganz fährt (`options_that_narrow` in `tools/test_surface.json`,
  beim Kit-Haken im

  `INV` mit `scope: test_surface`). Keine Eigenschaft des TEXTES entscheidet das.'
severity: medium
hole_number: H152
source: docs/holes/H152.md
limits: 'die Aufzählung `options_that_narrow` sagt, nach welcher Option eine Zeile
  die erklärte Fläche nicht mehr ganz fährt — eine Tatsache über den LÄUFER, die keine
  Eigenschaft des Textes entscheidet. **Geschlossen in Prüfung 1:** die zehn Sortier-/Cache-Optionen
  (`--ff`, `--lf`, …) verengten nichts und sind aus der Erklärung heraus (gemessen:
  drei von drei Tests liefen unter jeder weiter); ein leerer Wert (`-k ""`, `-k=`)
  zählt nicht mehr. **Geschlossen in Prüfung 2:** dieselbe Option ZWEIMAL, die letzte
  leer (`-k alpha -k ""` fährt alles) — jetzt entscheidet das letzte Vorkommen je
  Options-NAME, wie `argparse` es tut. **Offen, fail-open:** eine ERKLÄRTE Option
  mit einem wohlgeformten Wert, der nichts trifft (`--deselect does::not::exist`,
  `--ignore=<nicht vorhandener Pfad>`, `--ignore-glob=*zzz*`, ein `-k`-Ausdruck, der
  alles auswählt) liest sich als Auswahl und passiert — gemessen an der Sonde, drei
  von drei Tests liefen. Was ein Wert TRIFFT, weiss erst eine Sammlung, und eine Sammlung
  der ganzen Suite ist genau die Kosten, gegen die das Gate existiert (`FR-0086`,
  Anpassung 1). Begrenzt durch: die versehentlich getippte Klasse ist zu, die verbleibende
  muss jemand absichtlich hinschreiben, und die Aufzählung trägt drei Stolperdrähte,
  von denen einer die Eigenschaft am Läufer misst (`.claude/hooks/test_gates.py::test_every_declared_narrowing_option_really_makes_the_runner_run_fewer_tests`)'
