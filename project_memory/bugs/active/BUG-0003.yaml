id: BUG-0003
title: Die Ledger-Redirect-Regel liest rohen Text statt der aufgeloesten Zeichenkette
related_pr: PR-0003
severity: medium
repro: Eine schreibende Umleitung auf eine Ledger-Datei so formulieren, dass das Ziel
  erst nach dem Aufloesen von Anfuehrungszeichen sichtbar wird.
expected: Der Waechter vergleicht die AUFGELOESTE Zeichenkette -- dieselbe Haerte,
