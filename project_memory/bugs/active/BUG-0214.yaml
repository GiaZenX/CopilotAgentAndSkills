limits: 'die Zeilennummern der Anlage EÜR, die das Kit ausliefert (`templates/project_memory/master_data.yaml`,
  `euer_form:`), stammen aus öffentlichen Ausfüllhilfen und NICHT aus dem amtlichen
  Vordruck; zwei der gelesenen Quellen widersprachen sich bei der Werbe-Zeile (51
  gegen 54), und zwischen zwei Formularjahren verschieben sich die Nummern messbar.
  Begrenzt durch: Formularjahr und Herkunft stehen IM Vokabular, beide Leser drucken
  sie neben jede Zeilensumme, im Code steht keine Nummer und kein Jahr — eine Korrektur
  ist eine Zeile in einer Nutzerdatei (`tools/test_finance_dashboard.py::test_a_fresh_project_ships_a_category_vocabulary_the_p4_12_stall_cannot_recur_on`)'
