id: BUG-0235
title: Was der Leser nicht platzieren kann, und was er gar nicht erst sieht (neu,
  TSK-0121; nach Prüfung 3 erweitert)
related_pr: PR-0003
observed: '**Mechanismus (a) — der Vorfilter.** Beide Hälften des Gates suchen zuerst
  in der rohen Zeile (ohne

  Quotierungszeichen) nach dem Namen eines erklärten Läufers. Das ist der Preis dafür,
  dass das Gate

  auf JEDER Shell-Zeile sitzt — in diesem Repo neben zwei anderen Lesern derselben
  Zeile, im Kit neben

  acht. Eine Zeile, die den Läufernamen erst zur Laufzeit herstellt (`$RUNNER tools/`,

  `R=pytest; $R tools/`), passiert ihn und wird nicht beurteilt.'
severity: medium
hole_number: H153
source: docs/holes/H153.md
limits: '(a) einen Läufernamen, den erst die Shell herstellt, sieht der billige Vorfilter
  beider Gate-Hälften nicht — gemessen: `pytest tools/` ist **rc 2**, `R=pytest; $R
  tools/` ist **rc 0**. (b) Ein Zielwort, dessen ORT dieser Leser nicht bestimmen
  kann, gilt als deckend und wird verweigert (fail-closed, mit eigenem Satz): laufwerksrelativ
  (`C:tools`), eine POSIX-Schreibweise, die ein Windows-Prozess in ein nicht vorhandenes
  Verzeichnis auflöst (`/c/…`), ein nicht eingehängtes Laufwerk, eine UNC-Freigabe,
  die niemand bedient, und ein Payload ohne `cwd` — alle gemessen rc 2. Seit Prüfung
  3 ist das die ganze Restliste: ein Ort, den der Leser FINDEN kann und der nicht
  dieses Repo ist, gilt als Auswahl (rc 0), damit jedes Rot-zuerst-Rig, das `CLAUDE.md`
  ausserhalb des Repos vorschreibt, wieder läuft. Begrenzt durch: ein Link von aussen
  IN die erklärte Fläche wird vom Identitätsleser zuerst beantwortet (gemessen, Junction
  → rc 2), und der Vorfilter fängt die Klasse, die versehentlich getippt wird, weil
  sie den Läufernamen wörtlich trägt'
