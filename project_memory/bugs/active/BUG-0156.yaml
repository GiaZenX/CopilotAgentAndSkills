id: BUG-0156
title: Jedes `>` eines Segments ist dem Ledger-Gate eine Umleitung, auch quotierte
  Prosa — offen, Über-Verweigerung als bewusster Preis (neu, TSK-0083)
related_pr: PR-0003
observed: '**Mechanismus:** Der F3-Fix der Runde (`_redirect_targets`, `finditer`)
  liest **alle**

  Umleitungsziele eines Segments, und zwar auf einer Sicht, die den Inhalt quotierter
  Spannen

  behält; die Redirect-Prüfung steht vor der Stufenausnahme der verbürgten Läufe.
  Ein `>` in

  ehrlicher Argument-Prosa ist damit von einem echten Redirect nicht unterscheidbar
  — verweigert

  wird, sobald das Folgewort ein Ledger-Pfad oder eine geschützte Datei ist.'
severity: medium
hole_number: H64
source: docs/holes/H64.md
limits: '`gate_ledger_valid` liest seit dem F3-Fix JEDES `>` eines Segments als Umleitung
  — auch in quotierter Argument-Prosa, auch in den Argumenten eines verbürgten Laufs,
  weil die Redirect-Prüfung vor der Stufenausnahme steht und die gelesene Sicht den
  Inhalt quotierter Spannen behält. Verweigert wird nur, wenn das Folgewort zugleich
  Ledger-Pfad oder geschützte Datei ist (`--note "row > ledger/2026.csv"` rc 0→rc
  2; `--note "net > gross"` bleibt rc 0). Schließen hieße zu wissen, welches `>` die
  Shell ausführt — dieselbe Grenze wie H34s Familie, in die sichere Richtung aufgelöst'
status: TRIAGED
revision: 1
approval_ref: null
