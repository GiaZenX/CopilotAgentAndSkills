limits: 'die Rangfolge-Regel urteilt über `[data-view]`-Container, also über das,
  was der Entwurf DEKLARIERT: dasselbe Markup mit zwei `data-primary-action` ist **rc
  3** mit `data-view` und **rc 0** ohne. Und der Kontrast schweigt über Text auf Bild/Verlauf/halbdurchsichtiger
  Schicht — als `NOT DECIDABLE` gedruckt, weder Befund noch bestanden. Begrenzt durch:
  die SKILL-Zeile macht das Auszeichnen zum Verfahrensschritt, die undecidable-Zeile
  wird gedruckt, und beide Hälften der zweiten Grenze hält ein Test'
