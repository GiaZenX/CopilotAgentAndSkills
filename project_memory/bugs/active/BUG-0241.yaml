id: BUG-0241
title: Der Zeigerleser der drei Rollentexte sieht nur Backticks und nur Item-Ids (neu,
  TSK-0123, DEC-0070)
related_pr: PR-0003
observed: '**Mechanismus.** `.claude/agents/` wird von keiner anderen Suite gelesen:

  `tools/test_repo_hygiene.py::_texts_that_answer_for_a_claim` läuft über `team-kits/`
  und `docs/`,

  `.claude/hooks/test_gates.py` über sein eigenes Verzeichnis. Diese Runde gibt den
  drei

  Harness-Rollentexten ihren ersten Leser — er löst jede Item-Id gegen den Zustand
  auf und jeden

  Test-Knoten gegen die Suite. Was er NICHT sieht, ist dasselbe Restpaar, das `.claude/hooks/test_gates.py`
  für sein

  Verzeichnis benennt, plus eines mehr: ein Testname ohne Backticks, eine Eigenschaftsbehauptung,
  die

  gar keinen Test nennt, und ein Zeiger, der kein Item und keinen Test ist — ein Pfad,
  ein

  Dokumentabschnitt.'
severity: medium
hole_number: H159
source: docs/holes/H159.md
limits: 'der erste Leser der drei Harness-Rollentexte löst Item-Ids und Test-Knoten
  auf und sieht drei Sorten Zeiger nicht: einen Testnamen ohne Backticks, eine Behauptung,
  die gar keinen Test nennt, und einen Zeiger, der weder Id noch Test ist (ein Pfad).
  Vier Mutationen, alle rc 0 (`_round-scratch/TSK-0123/residue.py`), gegen die Kontrolle
  mit Backticks bei rc 1. Nicht geschlossen aus demselben Grund wie bei `test_gates._points_into_this_file`:
  ein Leser ohne Auszeichnung würde an Prosa rot. Begrenzt durch: was in Backticks
  steht, löst auf, und beide Richtungen des Lesers sind gemessen'
