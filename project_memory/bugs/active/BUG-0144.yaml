id: BUG-0144
title: Ein Zombie-Dispatch hält rollengleiche id-lose Zuordnungen dauerhaft still
  — offen (neu, TSK-0080)
related_pr: PR-0003
observed: '**Mechanismus:** Ein `SubagentStop` ohne `agent_id` wird nur zugeordnet,
  wenn **genau ein**

  Dispatch der Rolle als Eigentümer in Frage kommt (`_dispatches_a_stop_could_belong_to`;

  gebundene, ungebundene und fristüberschrittene zählen alle mit — der Ausschluss
  Abgelaufener

  öffnete die gemessene spiegelbildliche Fehlzuordnung auf den frischen Dispatch).
  Ein gebundenes

  Kind, das nie stoppt (H50-Fall), bleibt darum für immer möglicher Eigentümer: jede
  spätere

  id-lose Meldung derselben Rolle ist mehrdeutig und wird verweigert — als exit-0-stderr,
  also

  faktisch nur eine Audit-Zeile.'
severity: medium
hole_number: H52
source: docs/holes/H52.md
limits: 'ohne `agent_id` wird verweigert statt geraten; ein Zombie-Dispatch hält damit
  rollengleiche id-lose Zuordnungen dauerhaft still. Begrenzung: der repo-eigene Messwert
  sagt, dass `SubagentStop` die Id trägt (der Zweig ist der Ausnahmefall), und die
  Verfassung verlangt gleichrollige Aufgaben sequenziell'
