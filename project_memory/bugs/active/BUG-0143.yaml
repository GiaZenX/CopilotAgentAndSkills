id: BUG-0143
title: Nach der einen Verweigerung schweigt der Melder für denselben Befund — offen
  (neu, TSK-0080)
related_pr: PR-0003
observed: '**Mechanismus:** `gate_dispatch` verweigert das Zugende höchstens **einmal
  je Befund**

  (`mark_idle_reported` vergleicht die gespeicherte Begründung; bei `stop_hook_active`
  hält es

  still) — ein verweigerter Stop wird vom Provider mit Weitermachen beantwortet, ohne
  die Schranke

  wäre es eine Schleife. Ein Lead, der die Verweigerung liest und trotzdem weiter
  wartet, wird

  nicht erneut angehalten.'
severity: medium
hole_number: H51
source: docs/holes/H51.md
limits: die Verweigerung des Zugendes kommt höchstens einmal je Befund; danach tragen
  `idle_reported` auf dem Item, die Board-Karte und der Verfassungstext — die Audit-Zeile
  jedes weiteren Stops erreicht nach repo-eigener Messung weder Nutzer noch Modell
