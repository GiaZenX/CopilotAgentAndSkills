id: BUG-0170
title: Ein Startmodus, der die Projekteinstellungen nicht lädt, entfernt den ganzen
  Durchsetzungsapparat — offen, von innen nicht schließbar (TSK-0094)
related_pr: PR-0003
observed: '**Der Mechanismus, in einem Satz** (so formuliert der Prüfer, und so gehört
  er gelesen —

  `--restricted` ist nur die Schreibweise, an der es auffiel): **jeder Client-Startmodus,
  der die

  Projekteinstellungen nicht lädt, entfernt alle vier Registrierungsflächen eines
  Kits, während die

  Dateiwerkzeuge im Projekt schreibfähig bleiben.**'
severity: medium
hole_number: H78
source: docs/holes/H78.md
limits: 'ein Client-Startmodus, der die Projekteinstellungen nicht lädt, entfernt
  alle vier Registrierungsflächen des Kits, während die Dateiwerkzeuge im Projekt
  schreibfähig bleiben — drei Mitglieder gemessen, die Kette bis Merge+Push durchgefahren
  (`validate`: 0 Fehler auf gefälschtem Zustand), vier Ränder benannt (Einstiegspunkt
  beschreibbar und außerhalb des Vertrauens-Hashes, `permissions.deny` fällt unter
  `--restricted`, Werkzeugfläche 7→152/159 inkl. MCP, Verfassung lädt nicht). Von
  innen nichts baubar; Begrenzung: bewusster Start, korrigierte Kit-Prosa (`TSK-0095`),
  informierter Nutzer'
