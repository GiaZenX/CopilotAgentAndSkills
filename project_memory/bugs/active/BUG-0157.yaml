id: BUG-0157
title: Ein Wort, das die Shell erst durch Expansion herstellt, sieht dieser Leser
  nicht — offen, Loch, vorbestehend (benannt TSK-0083)
related_pr: PR-0003
observed: '**Mechanismus:** Jeder Pfadleser dieses Gates urteilt über den **Text**,
  den der Nutzer

  geschrieben hat. Stellt die Shell das Zielwort erst her — `$f`, `${…}`, `${X:-…}`,
  ein Glob —,

  dann steht das Wort, auf das die Operation wirkt, nirgends im Text. Das ist keine
  Frage der

  Zeichenklasse und nicht durch ein weiteres Zeichen im Muster zu beheben: es fehlt
  der Zustand

  der Shell, und den hat ein `PreToolUse`-Hook nicht. Bis zur Korrektur in TSK-0083
  begründete

  der Kopfkommentar des Gates das Gegenteil (`scripts/$X` sei sonst „das nackte Verzeichnis")
  —

  bei ungesetzter Variable **ist** es das nackte Verzeichnis, die Begründung war von
  der Messung

  widerlegt.'
severity: medium
hole_number: H65
source: docs/holes/H65.md
limits: ein Zielwort, dessen Pfad die Shell erst durch Expansion **herstellt oder
  beendet** (`$f`, `${…}`, `${X:-…}`, Glob), steht so nicht im Text — dieser Leser
  sieht nur die Schreibweise, nicht das Wort, das die Shell baut. `cp evil.py scripts/${n:-ledger_add.py}`
  ersetzt den Validator, rc 0. Nicht schließbar ohne den Zustand der Shell; begrenzt
  durch den Kit-Wächter derselben Zeile und dadurch, dass der Angreifer die Variable
  selbst setzen muss
status: TRIAGED
revision: 1
