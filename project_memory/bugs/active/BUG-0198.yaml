id: BUG-0198
title: Nach `/cd` läuft die Registrierung des ZIELVERZEICHNISSES, aber die Hook-DATEIEN
  des Startverzeichnisses (neu, TSK-0108, FR-0059)
related_pr: PR-0003
observed: '**Mechanismus.** Seit Claude Code 2.1.246 tauscht `/cd` Einstellungen,
  Hooks, Skills und MCP-Server

  gegen die des Zielverzeichnisses aus. `${CLAUDE_PROJECT_DIR}` bleibt dabei — laut
  Doku absichtlich —

  auf dem **Startverzeichnis** stehen. Jede Hook-Kommandozeile, die unsere Kits und
  dieses Repo

  schreiben, buchstabiert ihren Pfad genau damit

  (`python -B "${CLAUDE_PROJECT_DIR}/.claude/hooks/<gate>.py"`). Beides zusammen ergibt
  ein Paar, das

  niemand gewollt hat: **welche** Hooks registriert sind, entscheidet das Ziel; **welcher
  Code** dann

  läuft, entscheidet der Start.'
severity: medium
hole_number: H114
source: docs/holes/H114.md
limits: 'nach einem Verzeichniswechsel läuft die Registrierung des Ziels, aber die
  Hook-DATEIEN des Startorts (`${CLAUDE_PROJECT_DIR}` bleibt stehen, und genau so
  buchstabieren die Kits ihre Kommandozeilen) — gemessen über BEIDE Wege, `/cd` und
  die Steuer-Anfrage `set_cwd` der VS-Code-Erweiterung. Begrenzt durch: kein Werkzeug
  des Modells löst den Wechsel aus, er kommt vom Client. Auf dem `/cd`-Weg geht ein
  Trust-Dialog voran, aber nur vor dem ERSTEN Wechsel in ein Verzeichnis (gemessen:
  Erst-Dialog `m2a.log`, späterer Wechsel dialogfrei `m4.log`). Auf dem `set_cwd`-Weg
  ist gemessen nur der dialogfreie Wechsel an ein bereits vertrautes Ziel; ob an einem
  unbekannten Ziel ein Dialog erscheint, ist NICHT gemessen'
status: TRIAGED
