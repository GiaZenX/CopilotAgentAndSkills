id: BUG-0141
title: Die zweite Vertragsverletzung eines Subagenten läuft ungebremst durch (neu,
  TSK-0075)
related_pr: PR-0003
observed: '**Mechanismus:** `gate_subagent_output` blockiert einen Spezialisten, der
  ohne seinen

  Ausgabeblock stoppt. Der Provider setzt auf der dadurch ausgelösten Fortsetzung

  `stop_hook_active`, und der Hook ehrt dieses Flag: er beendet mit 0, statt erneut
  zu blockieren.

  Wäre es anders, liefe der Subagent in eine Endlosschleife, denn das Flag steht auf
  jeder

  weiteren Fortsetzung ebenfalls. Damit ist genau die **zweite** aufeinanderfolgende
  Verletzung

  ungeblockt — der PM baut dann doch auf Prosa.'
severity: medium
hole_number: H49
source: docs/holes/H49.md
limits: 'an die Stelle des Schutzes treten drei Begrenzungen: die erste Verletzung
  wird blockiert und präzise angeleitet; der Durchlass ist zustandsgenau protokolliert
  (`gave_up` vs `retry_delivered`), sodass die PM-Retro den Fall zählt statt ihn zu
  verlieren; die `ENFORCEMENT.md`-Zeile aller drei Kits nennt den Durchlass. Ein Zähler
  wäre beschreibbarer Zustand über eine Durchsetzungsfrage — bewusst nicht gebaut'
status: TRIAGED
revision: 1
approval_ref: null
created: '2026-09-05T20:23:46'
