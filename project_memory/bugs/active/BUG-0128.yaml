id: BUG-0128
title: Ein einzelner Aufruf nach C gibt den Interpreter nicht zurück (neu, TSK-0021)
related_pr: PR-0003
observed: '**Mechanismus:** der Faden aus H35 kann nur unterbrechen, was der Interpreter
  zwischen zwei

  Bytecodes aus der Hand gibt. Ein einzelner Aufruf in eine C-Funktion tut das nicht.
  Der teuerste

  davon auf diesem Weg ist die Heredoc-Erkennung der Kits (`gate_write_scope._HEREDOC_RX`),
  deren

  Kosten quadratisch mit der Zahl der Öffner wachsen.'
severity: low
hole_number: H36
source: docs/holes/H36.md
limits: 'die Grenze ist gemessen und liegt außerhalb des Gates: die Zeilenlänge, ab
  der die nicht unterbrechbare Stelle die Frist reißt, kann auf diesem Host keine
  Shell mehr gestartet bekommen. Der Eintrag nennt, was das ändern würde'
status: TRIAGED
revision: 1
approval_ref: null
created: '2026-09-05T20:23:14'
