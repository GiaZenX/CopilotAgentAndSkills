id: BUG-0194
title: Einen Check, den der Kernel nicht lesen kann, beantwortet er mit UNENTSCHIEDEN
  (neu, TSK-0106, FR-0039)
related_pr: PR-0003
observed: '**Mechanismus.** Die Auflösung oben parst die Datei, die `check.ref` nennt.
  Für eine Datei, die

  kein Python ist — `src/rules.test.ts`, eine Go- oder Rust-Datei —, kann sie die
  Frage nicht

  beantworten. Sie gibt darum `None` zurück, und der Validator macht daraus eine **Warnung**:
  kein

  Merge wird angehalten, und der Produzent lässt das Item `unverified`.'
severity: medium
hole_number: H110
source: docs/holes/H110.md
limits: 'einen Check, dessen Datei der Kernel nicht parsen kann (ein Testfile in einer
  anderen Sprache), beantwortet er mit UNENTSCHIEDEN: eine Warnung, kein Merge-Blocker.
  Fail-closed wäre hier ein Merge-Verbot ohne Ausweg für jedes Projekt, dessen Tests
  nicht Python sind. Begrenzt: der Produzent verifiziert nichts, was er nicht lesen
  kann, die Warnung nennt die Grenze, und für lesbare Checks bleibt der Blocker scharf'
regression_tests:
- test_report.test_an_invariant_whose_check_this_kernel_cannot_read_blocks_nothing
- test_staging_cli.test_verify_invariants_records_what_the_check_resolves_to_and_exits_on_the_gap
status: TRIAGED
