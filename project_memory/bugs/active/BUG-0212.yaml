id: BUG-0212
title: Was eine Zerstörung ist, bleibt eine Vokabelliste (neu, TSK-0116, FR-0050)
related_pr: PR-0003
observed: '**Mechanismus.** Die WO-Hälfte der Zerstörungsregel ist eine Definition,
  die WAS-Hälfte

  nicht: `guard_fs_tripwire.NAMING_DESTRUCTION` und `SWEEPING_DESTRUCTION` sind Wortstämme.
  Ob ein

  Programm eine Datei entfernt, ist eine Tatsache über dieses Programm und aus der
  Befehlszeile

  nicht ableitbar — ein `PreToolUse`-Haken läuft VOR der Zeile und hat kein Nachher,
  gegen das

  er vergleichen könnte. Ein Programm, dessen Kommandowort, Flaggen und Unterbefehle
  keinen dieser

  Stämme tragen, geht durch; dasselbe gilt für eine Löschung innerhalb eines anderen

  Programms (`python -c` mit `os.remove`).'
severity: low
hole_number: H129
source: docs/holes/H129.md
limits: 'die Hälfte der Zerstörungsregel, die sagt WAS zerstört, bleibt eine Vokabelliste
  (`guard_fs_tripwire.NAMING_DESTRUCTION` / `SWEEPING_DESTRUCTION`): ob ein Programm
  eine Datei entfernt, ist eine Tatsache über das Programm und aus der Befehlszeile
  nicht ableitbar — ein `PreToolUse`-Haken läuft VOR der Zeile und hat kein Nachher
  zu vergleichen. Begrenzt durch: jeder Eintrag ist an BEIDEN Enden gemessen (`tools/test_hooks.py::test_every_destroying_stem_is_load_bearing_at_both_ends`),
  die Stämme werden über JEDES Wort einer Aufrufung und nach Wortstamm gelesen (Kommandowort,
  Flagge, Unterbefehl), sodass jede Verb-Substantiv-Form ohne eigene Nennung trägt
  — ein ALIAS jedoch nur, wenn er selbst ein Stamm ist (`ri`, `clc` sind es; gemessen)
  —, und nach `DEC-0056` ist der Gegner der IRRTUM und nicht der Vorsatz'
regression_tests:
- tools/test_hooks.py::test_every_destroying_stem_is_load_bearing_at_both_ends
status: TRIAGED
