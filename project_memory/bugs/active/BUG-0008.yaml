id: BUG-0008
title: Ein PowerShell-Modulcache liegt unverfolgt im Repo-Wurzelverzeichnis
related_pr: PR-0003
severity: low
repro: '`git status` im Repo-Wurzelverzeichnis ausfuehren.'
expected: Werkzeugspuren, die beim Ausfuehren entstehen, sind ignoriert und tauchen
  nicht als neue Dateien auf.
observed: '`Microsoft/Windows/PowerShell/ModuleAnalysisCache` liegt im Wurzelverzeichnis
  und ist NICHT in .gitignore. Es taucht bei jedem `git status` als unverfolgt auf
  und koennte versehentlich mitcommittet werden -- der Pruefer hat es in Runde 1 selbst
  als Befund gemeldet. Entstanden durch einen PowerShell-Aufruf, der seinen Cache
  dorthin schrieb.'
acceptance_criteria:
- Der Pfad ist ignoriert und der vorhandene Ordner entfernt.
- Der .gitignore-Eintrag traegt eine Begruendung, damit ihn niemand als Altlast wieder
  herausnimmt.
- Geprueft ist, ob weitere Werkzeuge in dieses Repo schreiben -- gemessen, nicht vermutet.
status: TRIAGED
revision: 1
approval_ref: null
created: '2026-08-04T16:59:05'
