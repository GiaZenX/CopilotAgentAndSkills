id: BUG-0215
title: Eine Antwort autorisiert jetzt N Ziele statt eines (neu, TSK-0117, FR-0074)
related_pr: PR-0003
observed: '**Mechanismus.** Bis zu dieser Runde war jede item-gebundene Freigabe an
  GENAU EIN Item gebunden:

  `approvals.assert_apr_in_force` verglich `apr["item"]` mit der Id des Vorgangs,
  und ein `scope`-Ja

  konnte nichts anderes freigeben. Die Plan-Freigabe (`approvals.PLAN_KIND`) bricht
  diese Bindung

  absichtlich: ihr Subjekt ist eine LISTE, und ein einziger Klick lässt jedes Ziel
  darin die Kante

  `DRAFT -> APPROVED` gehen. Damit hängt die Breite der Erlaubnis nicht mehr an der
  Frage, sondern

  an der Zahl der offenen Ziele im Speicher zum Zeitpunkt der Frage.'
severity: medium
hole_number: H132
source: docs/holes/H132.md
limits: 'die Plan-Freigabe (`approvals.PLAN_KIND`) bricht absichtlich die Ein-Item-Bindung:
  EINE Antwort lässt jedes Ziel ihrer Liste die Kante `DRAFT -> APPROVED` gehen. Am
  Piloten außerhalb des Repos mit dem ausgelieferten `gate_approval.py` als Prozess
  gemessen: zwei Ziele, eine Frage, beide danach APPROVED und beide mit demselben
  `approval_ref`; `IN_DELIVERY` bleibt verweigert. Begrenzt durch: nur die Scope-Frage
  (Lieferung und Abnahme bleiben je Ziel), den Hash über die Liste UND über das Scope-Manifest
  jedes Ziels (ein geändertes Ziel fällt aus der Deckung, die übrigen bleiben), die
  Verweigerung einer leeren Liste, und eine Frage, die jedes Ziel namentlich nennt
  statt zu zählen. NICHT begrenzt: die Länge der Liste — dreißig Ziele sind eine Frage'
status: TRIAGED
revision: 1
