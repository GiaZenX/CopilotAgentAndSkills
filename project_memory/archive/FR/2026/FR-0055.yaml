  gewinnen weiter, user/merge_settings.py-Semantik), damit eine frische Installation
  aus ist statt Provider-Default. Betrifft user/claude/settings.json samt Kommentar;
  faehrt mit dem FR-0048-Halb-2-Home-Rollout mit.'
