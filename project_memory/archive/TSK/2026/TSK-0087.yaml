- 'what TSK-0078/FR-0049 already built and what it does NOT: the filing-reviewer ROLE
  PATH exists (agent, skill, both schemas, constitution 2.5) but the kit says so itself
  in hooks/ENFORCEMENT.md -- ''the review pipeline in front of it is procedure and
  not a mechanism ... a proposal nobody reviewed reaches this gate exactly like any
  other move''. Verifier-measured 2026-08-25 in a real office project: a shell move
  AND a direct write into a plan-covered archive path pass the FULL registered chain
  rc 0 with NO review record; control into an uncovered path rc 2'
- gate_filing.py and _filing.py as they run today (the rule match, fail-closed on
