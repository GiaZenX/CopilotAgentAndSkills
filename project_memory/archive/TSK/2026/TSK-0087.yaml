expected_outputs:
- 'STEP 1 MEASURE, and one number is for the USER: against a scaffolded office project
  outside the repo, reproduce the gap (a move with no review record passes) and MEASURE
  what a second independent classification costs -- wall time and, where measurable,
  tokens per document. The lead brings that number to the user, whose item explicitly
  reserves the policy question (two runs for every document, or only for classes the
  plan marks). Report it as its own line'
- 'STEP 2 BUILD the mechanism so the POLICY is a plan property, not a constant: a
  move out of inbox/ into a plan-covered path is refused unless TWO independent classification
  records agree on target path AND name; disagreement or a missing second reading
  leaves the document where it is and names both readings for the user. Independence
  is enforced, not hoped: the second record must come from a separate run that did
  not see the first (measure how you enforce it and say what that check can and cannot
  see). Which document classes require the second reading is read from the filing
  plan, defaulting to ALL where the plan says nothing -- the safe side, and the user''s
  decision then narrows it by rule instead of by rebuild'
- 'STEP 3 TESTS: red-without-fix in a clone outside the repo for each half -- a move
  with no review record refused, a move with two AGREEING records allowed, two DISAGREEING
  records refused with both readings named, a second record that is not independent
  refused; and the counter-direction, so the gate cannot be satisfied by refusing
  everything. Measured as real hook processes through the full registered chain, not
  as unit calls'
- 'STEP 4 SHIP: bump_kit_version, ruff, validate, the affected suites per DEC-0050
  (the full run is the lead''s); mirrors byte-identical unless KIT_SPECIFIC_HOOKS
  names the reason; report file:line, the design chosen and WHY, the cost number,
  and residues named honestly'
