observed: '**Mechanismus:** `_stage_verb` liest den **deklarierten Namen** als Verb.
  Ein Verb, das nichts

  kennt, gilt als schreibfähig, also wurde jedes Wort des Rumpfes zum Schreibkandidaten
  — und

  `PYTHONPATH=team-kits` nennt den Kit-Baum. `_harness.stage_body` schnitt den Kopf
  einer Deklaration

  ab, prüfte aber nur, ob **irgendwo** im Kopf eine Klammer steht.'
