id: BUG-0125
title: Die erweiternde Antwort kam von einer Funktion, die eine andere Frage beantwortet
  (neu, TSK-0021)
related_pr: PR-0003
observed: '**Nachtrag TSK-0098:** die Tilde ist nicht mehr die einzige Konstruktion,
  die ein Wort

  unplatzierbar macht. `_harness._UNRESOLVED` gibt dieselbe Antwort für ein Wort,
  das eine Shell aus

  einer Expansion oder aus dem Dateisystem erst baut — und einige der Zeichen, die
  dieser Eintrag als

  harmlose Vorsätze vor einer Tilde führt (`*`, `[`, `{`, `?`), sind genau jene. Ein
  Wort wie

  `*~/team-kits/kernel/state.py` wird darum jetzt verweigert, obwohl die Tilde darin
  nicht am Anfang

  steht; `test_gate1_answers_for_a_tilde_that_does_not_start_its_word` fragt beide
  Leser statt nur

  diesen einen. Wo bash das Muster auf nichts abbildet und das Wort literal lässt,
  ist das eine

  Über-Verweigerung — und die fail-closed-Richtung, aus demselben Grund wie hier.'
