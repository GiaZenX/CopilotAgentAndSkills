id: BUG-0132
title: Vertragszitationen außerhalb der `.py`-Quellen von `.claude/hooks/` liest kein
  Stolperdraht (neu, TSK-0058)
related_pr: PR-0003
observed: '**Mechanismus:** Der TSK-0058-Stolperdraht (`test_no_statement_here_cites_a_replaced_contract_on_its_own`)

  findet die Zitation eines abgelösten Vertrags in den literalen Strings und Kommentarblöcken
  der

  `.py`-Dateien von `.claude/hooks/` — und nur dort. Vertragsprosa lebt aber auch
  in der

  Registrierung (`.claude/settings.json`, `_comment`), in den Rollendefinitionen

  (`.claude/agents/*.md`), in `CLAUDE.md` und in `docs/`. Keine dieser Flächen liest
  ein Draht:

  eine dort stehende Lebendzitation eines archivierten Vertrags altert unbemerkt.
  Zweite,

  schmalere Grenze im selben Draht (gemessen, TSK-0058-Prüfung F4): eine Zitation,
  die erst zur

  **Laufzeit** aus Teilen zusammengesetzt wird (f-String, `%`-Formatierung), ist auch
  in den

  `.py`-Quellen unsichtbar — nur die implizite Literal-Konkatenation wird gefaltet
  und gefangen.'
severity: medium
hole_number: H40
source: docs/holes/H40.md
limits: der Stolperdraht gegen Zitationen abgelöster Verträge liest die `.py`-Quellen
  von `.claude/hooks/` — Registrierung, Rollendefinitionen, `CLAUDE.md` und `docs/`
  liest kein Draht; die eine gemessene Lebendzitation steht im Eintrag, ihre Behebung
  liegt außerhalb des TSK-0058-Scopes
