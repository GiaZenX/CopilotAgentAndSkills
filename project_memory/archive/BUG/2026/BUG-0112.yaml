id: BUG-0112
title: Wo das Gate einer Bewegung nicht folgen kann, bleibt es stehen (neu, TSK-0011)
related_pr: PR-0003
observed: '**Mechanismus:** die Basis des Gates bewegt sich nur dorthin, wo eine Shell
  wirklich landet, und

  sie tut es nur, wenn die Shell den Wechsel selbst ausführt. Was der Leser nicht
  auflösen kann (eine

  Variable, ein Wort, das erst zur Laufzeit entsteht), was er nicht als Befehl der
  Shell selbst

  belegen kann (ein Verzeichnisverb, das die Kits als anderes Verb melden — hinter
  `if`, hinter `do`,

  hinter einer Array-Zuweisung) und was er nicht als Operandenliste verbuchen kann
  (H29) bewegt sie

  **nicht**. Ist die Shell in Wahrheit doch gegangen, urteilt das Gate an der falschen
  Stelle.'
severity: low
