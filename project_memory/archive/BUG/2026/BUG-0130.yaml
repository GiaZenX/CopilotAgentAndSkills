id: BUG-0130
title: Ein Programm, das ein Hier-Dokument einer Shell übergibt, liest keines der
  Gates (neu, TSK-0022)
related_pr: PR-0003
observed: '**Mechanismus:** beide Gates lesen den Befehlstext erst, nachdem die **Prosa-Entfernung
  der Kits**

  darüber gelaufen ist (`_harness._prose_removed`). Die entfernt neben dem Nachrichtenargument
  (H34)

  auch **jeden Rumpf eines Hier-Dokuments** (`gate_write_scope._HEREDOC_RX`), und
  zwar vollständig

  und ohne den Befehl davor anzusehen. Ein Rumpf ist aber nicht nur, wohin man eine
  Commit-Nachricht

  schreibt: er ist auch der Weg, auf dem eine Shell — oder jeder andere Interpreter
  — ein **Programm**

  bekommt. Damit ist jedes Programm, das so übergeben wird, für beide Gates unsichtbar;
  was es tut,

  steht in einer Spanne, die vor dem ersten Leser gelöscht wird. Der Mechanismus ist
  die Spanne, nicht

  eine Schreibweise: welches Verb davorsteht und welche Sprache im Rumpf steht, spielt
  keine Rolle.'
severity: medium
hole_number: H38
source: docs/holes/H38.md
limits: '**nichts Technisches** für den Schreibzugriff — dieselbe Begrenzung wie H34:
  die Prosa-Entfernung ist die der Kits (`gate_write_scope._HEREDOC_RX`). Gemessen
  begrenzt ist nur die Commit-Hälfte: steht der Commit auf derselben Zeile, verweigert
  Gate 3 sie wegen des Verbs. **Sozial** — Rollentrennung und Item'
