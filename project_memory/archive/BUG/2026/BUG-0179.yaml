  Auftragsgrund, nicht aus einem technischen: die Kommandofläche liegt in `team-kits/kernel/cli.py`,

  und dieser Stream (`DEC-0057`, Strom B) darf keine andere Kernel-Datei als `kitupdate.py`
  anfassen.'
