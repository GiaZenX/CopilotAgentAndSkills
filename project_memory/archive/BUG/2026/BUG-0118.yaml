id: BUG-0118
title: Ein Trenner, den der Leser nicht als Trenner las — GESCHLOSSEN (TSK-0013, erweitert
  TSK-0015)
related_pr: PR-0003
observed: '**Mechanismus:** wo ein Befehl endet, beantwortete Gate 1 mit der Trennerliste
  der Kits

  (`gate_write_scope._PIPELINE_SEPARATORS`: `&&`, `||`, `;`). Der asynchrone Trenner
  steht dort

  nicht, und `shlex` liefert **aneinandergrenzende** Satzzeichen als EIN Token (`);`,
  `)&&`), das

  keiner Schreibweise gleicht. Beides hat dieselbe Folge: das Zeilenende gehört zum
  Verb davor — und

  ein lesendes Verb sammelt keine Schreibkandidaten. Es braucht dafür keinen Verzeichniswechsel.

  **Dieselbe Ursache im eigenen Leser, gefunden 2026-08-05:** der Stufenschnitt war
  ein VERGLEICH mit

  `|` statt einer Frage an die Zeichen, also traf er `)|` nicht; und `_cuts` las jeden
  Lauf mit einem

  `&` als asynchronen Trenner, also auch `|&` — die Pipe, die stderr mitnimmt.'
