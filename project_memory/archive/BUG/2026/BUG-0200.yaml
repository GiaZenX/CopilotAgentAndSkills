id: BUG-0200
title: Die Hook-REGISTRIERUNG wird mitten in der Sitzung neu gelesen — auch zwischen
  zwei Werkzeugaufrufen einer Runde (neu, TSK-0108, FR-0059)
related_pr: PR-0003
observed: '**Mechanismus.** `CLAUDE.md` dieses Repos trägt den Satz „Was beim Sitzungsstart
  bindet, ist die

  Registrierung" — und leitet daraus ab, dass eine geänderte `.claude/settings.json`
  erst in der

  nächsten Sitzung wirkt. Auf 2.1.258 stimmt das nicht mehr: die Registrierung wird
  nachgelesen, ohne

  `/cd`, ohne Neustart und ohne Dialog.'
severity: medium
hole_number: H116
source: docs/holes/H116.md
limits: 'die Hook-Registrierung wird mitten in der Sitzung neu gelesen, sogar zwischen
  zwei Werkzeugaufrufen EINER Runde (gemessen) — `H12`s Fläche erweitert sich von
  „welcher Code urteilt" auf „ob überhaupt etwas urteilt". Begrenzt durch: dasselbe
  wie `H12` (Rollentrennung, Item) plus die Sichtbarkeit der geänderten `settings.json`
  im Diff'
