  das

  Verzeichnisverb hinter einem reservierten Wort oder hinter einer **Array**-Zuweisung,
  meldet der

  Leser ein anderes Wort als Verb — `do`, das erste Element der Klammer — und ein
  Wort, das kein

  Verzeichnisverb ist, bewegt nichts.'
