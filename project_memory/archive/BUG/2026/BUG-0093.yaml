observed: '**Mechanismus:** ein `PreToolUse`-Hook wird *vor* der Zeile gefragt. Jede
  Befehlszeile, die vor dem

  `commit` noch irgendetwas am Baum tut, lässt den Commit einen Zustand aufzeichnen,
  den kein Urteil

  je gesehen hat. Nicht `&&` ist der Mechanismus, sondern **jede** Verkettung, jede
  Umleitung, jeder

  schreibfähige Befehl davor.'
