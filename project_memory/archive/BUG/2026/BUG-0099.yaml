id: BUG-0099
title: '`carries_work` verlangt keinen erreichbaren Endzustand — OFFEN'
related_pr: PR-0003
observed: '**Mechanismus:** Gate 4 verlangt, dass ein Eintrag ein Item nennt, das
  Arbeit tragen **kann** (hat

  einen Automaten) und **nicht terminal** ist. `SR` hat die Kette `PROPOSED → ACCEPTED`
  und als

  einzigen Endzustand `SUPERSEDED`. Das natürliche Lebensende eines `SR` ist damit
  `ACCEPTED` — und

  das ist kein Endzustand, also trägt ein angenommenes `SR` für Gate 4 für immer „offene
  Arbeit".'
severity: medium
hole_number: H7
