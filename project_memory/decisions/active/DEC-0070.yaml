id: DEC-0070
title: 'Generation 3 verdict (DEC-0062 first cut, DEC-0063 rules): the cap holds for
  four of five streams, not for the seam-reading guard; the repeated finding class
  is the unrequested full suite run; the merge round found eleven findings no stream
  could see; three orchestrator failures cost more than any stream'
context: 'Generation 3 = five streams cut by FILE OWNERSHIP (DEC-0062), spawned 2026-09-03
  07:3x from e45c0ca, merged as TSK-0120 = commit 6704221 on feat/harness-v2, EVD-0080
  (merge verifier PASS in the third round: B1/B2 -- the office guard''s sweep base
  had to become a SET of positions mapped from every candidate, real bash as arbiter;
  two reworks, three verifications). Log: project_memory/staging/generation-3-streams.md;
  (g) rows per stream and the merge protocol staging/TSK-0120/merge-protocol.md section
  9. MEASURED (g): A board = Fable design 07:22-09:56 in four phases with four user
  taste rounds (~690 k) + Opus build ~4 h 30 first report, four verifications, three
  reworks, spawn -> PASS ~9 h 15 (~810 k impl / ~495 k verif); B office = ~2 h 20
  first report, FOUR verifications, three reworks + closing, ~7 h 30 (~745 k / ~525
  k); C approvals = ~3 h 20 first report with two mid-round seams, three verifications,
  two reworks + closing, ~13 h on the critical path incl. ~5 h idle from a lost completion
  notice and one HTTP 529 (~670 k / ~690 k); D texts = ~2 h 17, two verifications,
  one rework + closing, ~5 h 30 (~495 k / ~355 k); E design = ~3 h 30, three verifications,
  two reworks + closing, ~9 h 45 incl. ~2 h 20 of full-suite runs the order did not
  ask for (~475 k / ~360 k). Merge round ~4 h 15 + two reworks (1 h 20 + 1 h) ~6 h
  35 (~745 k), eleven merge findings of which four came out of the full run and none
  was visible to any stream (DEC-0063 (1) confirmed a second time). REPEATED FINDING
  CLASSES: (1) the unrequested full suite run -- five measured occurrences (D rework
  31 min, B rework + verifier ~45 min, C verifier 47 min, E rework x2 ~70 min, plus
  B''s gate suite 23 min for two reading tests) ~5 h of the generation; every implementer
  named it, none was stopped -> FR-0086 + FR-0057 (gen 4). (2) ''a guard that reads
  command lines opens the next class with every narrowing'' -- B: dot -> subdirectory
  -> cd in an argument -> cd that never lands -> cd that lands but does not act (H144,
  closed in the merge by the S9 separator), four verifier rounds, the verifier said
  ''nothing left to measure'' three times. (3) ''the fix''s own counter-gap'' -- E:
  suppression too wide, then pseudo-text nobody can see; A: the test covers one of
  three fields; C: the same rule via another verb -- each round''s fix opened one
  smaller gap in the counter-direction, caught by the next round. (4) ''a named test
  that cannot fail'' -- E B1 (substring window), A B-2 (comment names a test that
  does not read the map), A M-3 (two of three fields uncovered), A N-12 (arrival by
  type not strength) -- four instances, the class CLAUDE.md calls dearer than no test.
  FINDINGS AGAINST THE CUT (lead), eight: the research skill copy forced by the reference-skill
  contract (allowed_scope unfulfillable); TSK-0088 (DRAFT since August, scope team-kits/**)
  overlapping every stream; H141-H149 assigned by message outside the frozen items;
  the project_memory/** exception contradiction in every item; kit_browser_checks.py
  allowed vs research-team/** forbidden (E''s BUILD half not built, H139); the seam
  table said tools/test_hooks.py = A x B while A, B and C wrote it, plus three unnamed
  shared files (test_kernel.py, constitution_section_pins.json, phase0-disposition.md);
  ''every patch drops the VERSION hunks'' false (four of five carried them); DEC-0064''s
  cost list named two tripwires that do not see the defect. ORCHESTRATOR FAILURES,
  three, measured: a ''queued'' SendMessage to a completing agent read as a delivery
  / a lost completion notification (~5 h of C''s critical path); an order line ''no
  stamp'' refuted by validate.py (B) and ''last of current'' refuted by measurement
  (B M1); an order sentence ''every new registration carries a timeout'' contradicting
  a shipped test (E). USER DECISIONS captured during the generation: DEC-0064 (MST
  type), DEC-0065 (board), DEC-0066 (kit hierarchy in this repo, 14 FRs filed under
  PR-0003), DEC-0067 (bundle at PR level), DEC-0068 (plan approval), DEC-0069 (H138
  acceptance); wishes FR-0085 (SR duty by class), FR-0086 (full-run gate), FR-0087
  (holes as items); bugs BUG-0090, BUG-0091.'
decision: '(1) DEC-0062''s cut by file ownership is KEPT: the seam table held for
  what it named (every named seam resolved by hand with an arbiter), and the eight
  cut findings are all of one class -- what the lead did not MEASURE before cutting
  (a contract that forces a copy, a stale item''s scope, a patch''s VERSION hunks,
  which streams really write a shared file). From generation 4 the cut is measured,
  not written: the pre-dispatch overlap check of stream D / kernel check-scopes runs
  over the stream items BEFORE spawn, VERSION and hole-list ownership are stated as
  seams in every item, hole numbers are allocated by the kernel once FR-0087 lands
  and until then reserved IN the item text before READY. (2) The cap (DEC-0062 (3))
  holds for a stream whose subject is code with a contract (A, C, D, E: two to four
  verifications) and does not hold for a guard that reads command lines (B: four verifications,
  each narrowing opened the next class) -- such a guard is not cut as a stream but
  as a DEC-first design round with the class question asked once (the separator, the
  reach, the resolution), which S9 in the merge showed to be one field, not four patches.
  (3) The merge round stays its own verification (DEC-0063 (1), confirmed: eleven
  findings invisible to every stream, four from the full run). (4) DEC-0050 is not
  a sentence in an order any more: FR-0086 (gate) + FR-0057 go first in generation
  4 (G4-1), because five measured occurrences in one generation cost ~5 h and no order
  sentence stopped one. (5) Resume-not-respawn (DEC-0063 (6)) held under a 529 and
  a 429; the new orchestrator rule: a SendMessage result that says ''queued'' to an
  agent that is completing is not a delivery, and silence longer than a verification''s
  own wall-clock is a ListAgents check, not a wait. (6) Generation 4 = four product
  goals as decided by the user 2026-09-03 (G4-1 test discipline & hook hygiene, G4-2
  kernel contracts, G4-3 procedure & retrospective, G4-4 repo hygiene), cut as PRs
  (DEC-0067) with the wishes merged at triage, one TSK per PR, approved by ONE plan
  approval (DEC-0068, first use); the deliberately deferred block (FR-0024 interactive
  backlog system, FR-0023, FR-0025, FR-0019, FR-0022, FR-0081, FR-0033) is its own
  generation.'
consequences: 'Generation 3 delivered: MST milestones, the E-style board with one
  renderer, generated plan/mindmap diagrams, the office EUeR vocabulary and per-line
  sums, the archive guard closed for the named/ancestor/cd classes (H125, H144 closed),
  the plan approval kind, blocked evidence, SDK provenance, the parallel-specialist
  procedure in three kits, the design-standard checks in the render script, check-scopes
  + seam_scope -- release dev/research 2026.09.04-1, office 2026.09.04-2 (three stamps
  in the merge round -- one planned, two forced by the two blocking merge findings
  in the office guard; the third stamped office alone because only its hash moved).
  What it cost: ~53 h of stream wall-clock on the critical path C ~13 h, ~4.6 M implementer
  tokens and ~2.4 M verifier tokens, the merge ~4 h 15 / ~530 k. What the next generation
  pays less for: ~5 h of suite runs (FR-0086), ~5 h of orchestrator idle (rule 5),
  and the guard class (rule 2). Enforcement: rule 1 by check-scopes before spawn (measurable
  from generation 4), rule 4 by the gate FR-0086 builds, rule 5 by the harness-lead
  role text (an implementer edits it, gate 1 refuses the lead), the rest by the merge
  round''s seam table as before.'
