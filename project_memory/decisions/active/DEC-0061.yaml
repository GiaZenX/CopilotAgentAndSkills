id: DEC-0061
title: Eine Evidenz erklaert ihren Lauf -- Umfang und Befehl werden Vertragsfelder
  von EVD, optional getragen und am Merge gelesen; die Pflicht bleibt eine Nutzerentscheidung
context: 'FR-0040 (TSK-0069 Seitenpruefung N7). GEMESSEN: REQUIRED_FIELDS["EVD"] nennt
  kind, related, result, summary, artifact_refs -- kein Feld nennt den Befehl, den
  Umfang oder die Auswahl des Laufs, also ist ein PASS aus `pytest -k eine_sache`
  von einem PASS ueber die ganze Suite nicht unterscheidbar. Zugleich behaupteten
  zwei Stellen das Gegenteil: der Kommentar an `backlog_types.EVIDENCE_RESULTS` ("spec
  II.10a already rules that a partial run is not merge evidence") und der Verweigerungstext
  von `gate_git._refuse_unless_the_item_is_green` ("spec II.10a: a partial run is
  not merge evidence either") -- zwei Prosa-Zusagen ohne Leser. KOSTEN DER PFLICHT,
  gemessen statt vermutet: (a) EVD ist ein IMMUTABLE_TYPE, kein Kommando aendert ein
  Feld daran, und ein Pflichtfeld gilt fuer GESPEICHERTE Items (DECLARED_REQUIRED_FIELDS
  speist die Feld-Pflichtschleife des Validators) -- dieses Repository haelt auf dem
  Stand 6d18407 (2026-09-02) 75 aktive EVD-Datensaetze, von denen jeder am Tag der
  Pflicht ein Validator-Error waere, den kein Kommando repariert, und gate_memory_complete
  blockt darauf jeden Merge und Push; (b) die Pflicht stattdessen an die BEFEHLSZEILE
  zu haengen (required=True) macht jede ausgelieferte Rollen- und Verfassungszeile
  falsch, die `harness.py evidence` ohne die Flags lehrt -- in allen drei Kits.'
decision: '(a) EVD traegt zwei OPTIONALE Vertragsfelder: `run_command` (die ausgefuehrte
  Zeile, woertlich) und `run_scope` aus der geschlossenen Vokabel {full, selection}.
  Sie sind EIN Satz: `capture` verweigert eine Haelfte ohne die andere, denn ein Umfang
  ohne Befehl ist eine Behauptung ohne Beleg und ein Befehl ohne Umfang ein Datensatz,
  den der Merge nicht lesen kann. (b) Ein PASS, der sich als `selection` erklaert,
  ist KEIN Lieferurteil (report._delivery_evidence) -- ein FAIL aus einem Teillauf
  bleibt eines. Die Asymmetrie ist die Begruendung: ein Lauf ueber einen Teil der
  Arbeit kann einen Defekt zeigen, nicht seine Abwesenheit. (c) Der Kernel LEITET
  den Umfang NICHT aus der Befehlszeile ab: was ein Volllauf ist, ist eine Tatsache
  ueber den Testlaeufer des Projekts, nicht ueber eine Zeichenkette -- eine Liste
  von pytest-Flags waere eine Regel ueber EINEN Laeufer in einem Kernel, den drei
  Kits teilen. Die Erklaerung gehoert der Rolle, der Befehl ist das, woran ein Auditor
  sie prueft. (d) Eine Evidenz, die GAR KEINEN Umfang erklaert, behaelt den heutigen
  Stand. Ob die Erklaerung Pflicht wird -- und damit welche der beiden gemessenen
  Kosten das Projekt traegt -- ist eine Nutzerentscheidung und steht als H108 in docs/POST_V2_WISHLIST.md.'
consequences: 'Die beiden Prosa-Zusagen im Kontext sind fuer einen ERKLAERTEN Teillauf
  jetzt wahr und fuer eine schweigende Evidenz weiterhin zu stark -- der Satz in gate_git
  gehoert den Hooks und ist ein Naht-Item (S6). Rollen- und Verfassungstexte, die
  `harness.py evidence` lehren, sollten die beiden Flags nennen (Naht S5); ohne sie
  funktioniert das Kommando unveraendert. Die gebauten Stellen tragen die Nummer dieser
  Entscheidung, sobald sie erfasst ist: `backlog_types.RUN_SCOPES`, `backlog_types.RUN_RECORD_FIELDS`,
  `state.capture_preflight` (die Paar-Verweigerung) und `report._delivery_evidence`
  (Naht S10, im Merge einzusetzen). Nachbarn: DEC-0050 (Testumfang je Runde -- diese
  Felder sind das, was ihn ueberhaupt protokollierbar macht), FR-0057 (dieselbe Frage
  auf der Kit-Seite), H108.'
