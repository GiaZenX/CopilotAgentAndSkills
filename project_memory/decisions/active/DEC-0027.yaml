id: DEC-0027
title: Der Quotenriegel je Pilot steht bei 100 Dollar Gegenwert
context: 'Diese Maschine ist ueber claudeAiOauth mit subscriptionType=max angemeldet,
  nicht ueber einen API-Schluessel (ANTHROPIC_API_KEY und ANTHROPIC_AUTH_TOKEN beide
  ungesetzt); der Nachrichtenstrom traegt RateLimitEvent. total_cost_usd ist damit
  ein GEGENWERT zu API-Listenpreisen und keine Abrechnung. Verbraucht wird das Nutzungsfenster
  des Abos.


  Das ist die knappe Groesse, und sie trifft den Nutzer anders als Geld: ein davongelaufener
  Lauf blockiert ihn bei seiner eigenen Arbeit, statt eine Rechnung zu erzeugen. Messwerte
  zur Einordnung: ein Zug ueber claude -p 0,17 Dollar, fuenf Zuege ueber die SDK 0,47
  Dollar, beides Sonnet bei kleinem Kontext; mit wachsendem Projektkontext steigt
  der Betrag je Zug deutlich.


  Dieser Eintrag entsteht, weil der Sitzungsagent den Riegel zunaechst in docs/pilot/2026-08-09-plan.md
  geschrieben hatte -- zwei Stunden nachdem DEC-0025 genau diesen Fehler festgehalten
  hatte. Vom Nutzer zum zweiten Mal bemerkt.'
decision: 'Jeder Pilotlauf setzt max_budget_usd auf 100 Dollar Gegenwert. Erreicht
  ein Lauf die Grenze, bricht er ab und die Stelle wird notiert; sie wird nicht angehoben,
  um einen Lauf zu retten.


  Der Wert ist ein QUOTENMASS, keine Ausgabengrenze. Er beantwortet nur die Frage,
  wieviel Nutzungsfenster ein einzelner Pilot hoechstens verbrauchen darf, bevor jemand
  hinsieht.


  Vom Nutzer am 2026-08-09 auf 100 festgelegt, nachdem der Sitzungsagent 25 vorgeschlagen
  hatte.'
consequences: 'Ein Pilot, der die Grenze reisst, ist selbst ein Befund: entweder das
  Vorhaben war zu gross geschnitten, oder der Apparat kommt nicht voran. Beides gehoert
  in den Bericht und nicht in eine hoehere Zahl.


  Die drei Piloten koennen zusammen bis zu 300 Dollar Gegenwert binden. Die Migrationstests
  gegen die Kopien kosten nichts -- das ist lokales Python ohne Modellaufruf.'
source: Nutzerfestlegung 2026-08-09; eigene Messung der Anmeldeart und der Zugkosten;
  DEC-0025 als der Eintrag, dessen Regel hier zunaechst erneut verletzt wurde
status: VALID
