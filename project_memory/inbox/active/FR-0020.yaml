  ein frisch geklontes Projekt ohne passende globale Ablage braucht eine ehrliche
  Ansage statt stillen Fehlverhaltens. Zwischenstufe, sofort baubar: eine Installer-Option,
  die den Apparat per .gitignore aus der Versionsverwaltung haelt (Dateien bleiben
  lokal; Preis: frische Klone brauchen eine Neu-Installation).'
