id: FR-0007
title: 'Die Kommentardisziplin in die Kits: Verfassung und Rollendefinitionen'
related_pr: PR-0003
request_text: 'SR-0008 gilt fuer dieses Repo. In den Kits muss dieselbe Vorgabe stehen,
  sonst schreiben die Spezialisten in JEDEM Projekt weiter Essays -- und dort ist
  der Schaden groesser, weil dort niemand mit einer Pruefrunde gegenhaelt.


  Zwei Orte: die Verfassung (team-kits/*/constitution/AGENTS.md) traegt die Regel,
  und die Rollendefinitionen (team-kits/*/agents/*.md) tragen sie fuer die, die schreiben.
  Gespiegelt, byte-identisch, wie alles andere.


  Der Verweis-Teil ist in einem Projekt sogar staerker als hier: dort FUEHRT der Kernel
  die Items ohnehin, also ist ''siehe SR-0042'' ein Sprung zu einer Datei, die validate
  prueft. Ein Kommentar kann von einer Anforderung nicht mehr wegdriften, wenn er
  sie nur nennt.


  Offen: ob es dafuer einen messbaren Wachhund gibt oder ob es Prosa bleibt. Ein Test,
  der Kommentare auf ''behauptet eine Eigenschaft'' prueft, waere eine Heuristik ueber
  Prosa -- genau das, was wir nicht bauen. Wahrscheinlich traegt hier nur die Rollendefinition
  plus die Pruefrunde.'
status: TRIAGED
revision: 1
approval_ref: null
created: '2026-08-05T07:00:07'
triage_result: 'USER VERDICT 2026-09-02 (FR survey), sharpened: generell keine Kommentare
  im Code -- der Code muss so geschrieben sein, dass aus dem Code herauslesbar ist,
  was Funktionen, Methoden, Schleifen tun; mehr Kommentar = mehr Output-Tokens und
  mehr Gelegenheit fuer Fehlbehauptungen. The user asked whether the kits already
  carry this (measured: no -- only the language note), how it could be blocked, and
  whether it makes sense. LEAD ANSWER recorded with him: (1) yes on cost and yes on
  the false-claim risk -- the verifier caught six such comments on 2026-09-02 alone;
  (2) rule for the kits: no EXPLANATORY comments; a comment may only name a measured
  limit/hole with its measurement, or a WHY the code cannot express -- never a WHAT;
  docstrings that restate a signature are the same defect; (3) no prose-heuristic
  gate (house rule) -- but MEASURE first how much comment the specialists write in
  a real project before anyone builds a ceiling, and only then decide whether a per-file
  comment-ratio tripwire is honest; (4) zero comments would be too strict: the NOT
  CONTAINED / measured-limit sentences the verifiers rely on are comments and stay.
  Scope: constitution + role texts of all three kits, mirrored; pairs with FR-0010
  if that comes.'
