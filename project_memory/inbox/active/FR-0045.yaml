id: FR-0045
title: Claude-Design-Buendelformat als Designer-Vertragsschema festschreiben -- ein
  echter Export verifiziert die Dateinamen
request_text: 'User reminder 2026-08-16: is the Claude Design feature still on the
  list -- and the user offered to export a real design so we can see what it actually
  produces. Answer: it lives as prose in POST_V2_WISHLIST section 1b, never migrated
  to an item. The plan there: do NOT embed claude.ai/design (hosted, interactive,
  account-gated), but freeze its EXPORT bundle as the designer contract schema. Composition
  so far came from secondary sources only.


  MEASURED 2026-08-23 -- the user delivered a real export (Synaipse Design System.zip,
  184 entries, ~2 MiB, inspected read-only in v2-testbed/_round-scratch/FR-0045/):
  the community-claimed triple (design.html + screenshots/ + design-notes.md) is WRONG
  for a design-system export. The real shape is a SKILL: SKILL.md with frontmatter
  (name, description, user-invocable: true) that instructs reading readme.md; readme.md
  (~20 KB, brand voice, provenance of every asset, licensing caveats); _ds_manifest.json
  (namespace, 33 components, 30 cards, 309 tokens, 6 themes, 14 fonts, source: spa);
  tokens/*.css (9 files); components/<group>/<Name>.jsx + .d.ts + .prompt.md per component
  plus a <group>.card.html per group; guidelines/*.card.html + harness-definition.md;
  ui_kits/{desktop,remote,website}/ full JSX views + index.html + README; assets/
  (fonts woff2, logo/favicon svg); uploads/ (user-pasted reference images); tmp/,
  .thumbnail, styles.css, thumbnail.html, _ds_bundle.js, _adherence.oxlintrc.json
  (a lint config for brand adherence). Consequence for the contract: the export IS
  directly consumable as a Claude Code skill by the product-designer role (drop-in,
  SKILL.md is the entry point); the schema to freeze is SKILL.md + readme.md + _ds_manifest.json
  as the machine-readable spine, not an invented triple. Open: whether a PROTOTYPE/handoff
  export (as opposed to a design-system export) has a different shape -- only this
  one kind was measured.'
