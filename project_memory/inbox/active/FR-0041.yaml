id: FR-0041
title: Kit-Pinning und Rollback aufs vorige Bundle als Mechanismus (II.11/5) -- Vorbedingung
  der seitlichen RC
request_text: 'TSK-0069 side check N8. Measured: kitupdate.relation knows seven verdicts,
  none is a pin; the command surface (22 subcommands, parsed) has neither pin nor
  rollback; backups lie under .claude/backups/<stamp> (scaffold_team.sh:213-241) but
  no command replays them. Expected (II.11/5 + II.12): existing repos stay pinned;
  rollback restores the unchanged previous bundle. Without a pin the II.11/5 sentence
  is an intention, not a mechanism -- and FR-0004''s lateral RC depends on exactly
  this (side check section 6). Related: N13/FR classification (without stock classification
  there is no place a pin would be decided). Source: docs/reviews/2026-08-16-tsk0069-ii12-side-check.md
  N8.'
status: OPEN
revision: 1
approval_ref: null
created: '2026-08-16T14:06:25'
triage_result: 'CORRECTION 2026-09-01: the FR-0046 measurement this item leans on
  (three pilot copies as old-V2 update-kit stocks) was wrong -- they are V1 stocks;
  see FR-0046 triage_result. The pin/rollback mechanism itself was built and measured
  in TSK-0101 (stream B) on a synaipse copy made mixed; the verifier found and the
  rework closes: pin compared version not bundle (kit swap passed), rollback was a
  third door the pin did not guard, bash twin replayed a RESTORE_SET path outside
  the repo.'
