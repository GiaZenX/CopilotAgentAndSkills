id: FR-0010
title: Die fuenf Fehlformen einer Auftragszeile gehoeren in die Rolle des Projektmanagers
related_pr: PR-0003
request_text: 'DEC-0010, DEC-0011 und DEC-0012 halten fuenf Formen fest, in denen
  eine Auftragszeile danebengehen kann: Aufzaehlung statt Eigenschaft; Loesung statt
  Anforderung; Klammer mit Beispielen; Mutationsdeckung ohne Klassendeckung; falsch
  quantifiziert. Alle fuenf sind in drei Naechten aufgetreten, alle wurden von Pruefern
  gefunden, keine von mir.


  Sie gelten heute NUR fuer dieses Repo. In den Kits schreibt der PROJEKTMANAGER die
  Arbeitsauftraege -- dieselbe Taetigkeit, dieselben Fallen, und dort mit mehr Wirkung:
  ein Spezialist baut, was im Auftrag steht, und niemand haelt dagegen.


  Die Begruendung des Nutzers ist die schaerfste: eine LOESUNG im Auftrag treibt den
  Entwickler in eine Richtung, statt ihm das PROBLEM zu geben. Das ist nicht nur eine
  Frage der Pruefbarkeit -- es verschenkt die Moeglichkeit, dass der Umsetzer eine
  bessere Loesung findet als die, die der Auftraggeber im Kopf hatte. Gemessen ist
  genau das mehrfach passiert: ein Umsetzer hat eine vorgeschriebene Zweizeilen-Loesung
  als unzureichend WIDERLEGT und einen dritten Baustein gebaut, den niemand bestellt
  hatte.


  Zwei Orte: die Verfassung (team-kits/*/constitution/AGENTS.md) traegt die fuenf
  Formen als Regel fuer den, der Auftraege schreibt; die Rollendefinition des Projektmanagers
  verweist darauf. Gespiegelt, byte-identisch.


  Offen, und ehrlich: ein Test dafuer ist eine Heuristik ueber Prosa, also bauen wir
  keinen. Was trÃ¤gt, ist FR-0005 -- der Zuschnitt-Kritiker soll nicht nur fragen,
  ob ein Plan zu gross ist, sondern ob seine Zeilen eine der fuenf Formen tragen.
  Das ist ein Leser mit frischem Kontext gegen einen Text, keine Regex.'
