# filing_plan.yaml — owned by: Records-Clerk (structure changes need user approval via the manager)
# THE Aktenplan, and the ONLY machine-readable filing truth (spec II.9). Every rule says where a
# class of document lives, how it is named, what metadata it must carry and how long it is kept.
# `gate_filing` matches every file landing under archive/ against these rules; a document that
# matches NO rule is not moved, not renamed and not entered anywhere — the clerk leaves it where it
# is and asks the user with a concrete rule proposal (spec II.9: the plan is amended deliberately,
# never bent silently). Git is this file's version history.
#
# WHAT IS GENERATED FROM THIS FILE, exactly one thing: `scripts/process_doc.py` renders the Ablage
# section of `docs/verfahrensdokumentation.md` out of the rules below — every rule becomes a line,
# with every field it carries. A rule that is not here is not in the Verfahrensdokumentation
# either. There is NO standalone prose Ablage guideline and nothing in this kit generates one; if a
# project keeps prose next to this file, which document was written first is a discipline the kit
# cannot see and does not claim to enforce.
#
# WHERE THE RULES COME FROM, so this file is not an invention: `business_profile.yaml`'s
# `document_sources:` is the list of paper the business actually has, in the owner's own words,
# with the `document_types` each one produces. Every one of those types belongs to at least one
# rule below. `kernel.filing.uncovered_document_sources` is the reader that says which do not, and
# an installed project is told at every session start — because BUG-0061 is what happens when
# nobody checks: in pilot 4 the plan reached its rules only after the owner herself noticed, one
# missing drawer at a time, that suppliers, sales, company documents and a review tray were not in
# it. A source with no rule is not a smaller plan, it is a document class that will hit
# `gate_filing` and stop.
#
# Rule fields: id · path_template · document_types · filename_template · required_metadata ·
# collision_policy · retention · second_reading · examples. A rule may carry more — everything except
# `path_template` is rendered without being named.
#
# `second_reading` IS THE ONE FIELD A HOOK DECIDES ON BESIDES `path_template`, and it is the user's
# lever, not the kit's (FR-0035, FR-0028). Every rule asks for TWO independent classification
# readings before one of its documents may be filed — a second run that was not given the first
# answer has to arrive at the same path AND the same filename, or nothing moves and both readings go
# to the user. `gate_second_reading` is what refuses; `record_filing_reading` is what makes the
# readings countable. The ONLY way to release a rule is `second_reading: false` — the value YAML
# itself reads as the boolean false. Absent, `true`, a word or a list all mean "two", so a typo
# cannot quietly open a class. A RELEASE IS ONE READING, NEVER NONE: the choice the user is offered
# is one run against two, and a class nobody has to read at all would be a folder any document could
# be renamed into unseen. Start with everything at two (that is what an unfilled field means) and
# release a rule only where the user has decided the class is routine enough. In `path_template`, `<name>` stands for a
# non-empty run of characters INSIDE ONE path segment: it never spans a `/`, and a segment may mix
# literals and placeholders (`<Modell>_<Prozessor>`, `2026-<Monat>`). Everything else is literal, so
# `archive/finance/<year>/` covers `archive/finance/2026` and not `archive/finance/2026/q1`.
#
# -- RETENTION: A SPAN, ITS LEGAL BASIS, AND AN HONESTY NOTE (F2) --------------------------------
# `retention` is free text and it carries BOTH halves: how long, and the rule that says so --
# `retention: "8y (§ 147 AO; mit dem Steuerberater bestaetigen)"`. The span is what the session-start
# duty register reads (`_duties.retention_duties` in the hook directory); the basis is what it prints
# back to the user, so the number can be CHECKED instead of trusted.
#
# EVERY RULE CARRIES THE KEY, and it has exactly two honest forms. A span the reader can count, as
# above -- or `retention: null`, which says "this drawer has no span anybody can count from a year
# folder" and is a legitimate answer for a tray, a quarantine, or a retention that starts when
# something happens rather than when a year ends. What must NOT stand there is a sentence with no
# number in it: the reader reports a retention it cannot turn into a span as UNREADABLE, and a
# project that copied such a rule is told its deadline register is INCOMPLETE at every single
# session start, forever.
#
# WHAT THIS KIT KNOWS ABOUT THE GERMAN DEFAULTS, stated as what it is: the usual starting points are
# 8 years for Buchungsbelege (receipts, invoices) and 10 years for Buecher, Inventare and
# Jahresabschluesse, the 8 coming from the shortening of § 147 AO by the Viertes
# Buerokratieentlastungsgesetz. THE KIT READ NO PRIMARY SOURCE FOR ANY OF THAT and ships none: no
# Gesetzestext, no Bundesgesetzblatt entry, and the transitional rules and the exceptions were not
# checked at all. So these are a STARTING POINT for the conversation with the Steuerberater, not a
# statement of law, and no rule below ships with one.
# WHAT THE WATCHER CAN AND CANNOT SEE: it holds a rule's span against the YEAR FOLDERS directly under
# the rule's literal path (`archive/finance/incoming/2018/`). A plan not partitioned by year gets no
# retention reminder -- a limit of the watcher, never permission to keep documents forever. And it
# never proposes a deletion: a span that ran out produces a REVIEW duty, and the quarantine below is
# where a reviewed document goes.
#
# -- NAMING IS A SCHEME, NOT A HABIT (F3) -------------------------------------------------------
# `filename_template` belongs on every rule, and the shape this kit recommends is
#   "YYYY-MM-DD_<counterparty>_<doctype>"
# -- sortable by date, greppable by counterparty, self-describing. Deviations are legitimate and
# belong on the RULE that deviates rather than in somebody's head: a bank statement reads better as
# "YYYY-MM_<account>_statement" (no day), a contract as "YYYY-MM-DD_<counterparty>_<subject>_v<n>",
# a Kaufbeleg as "YYYY-MM-DD_<vendor>_receipt". Without the field every filing decides anew what a
# file is called, and after a hundred documents the stock is unsortable -- measured in the field over
# four weeks of real operation.
#
# -- EINGANG AND ARCHIV: THE BOUNDARY IS A DEFINITION (F4) --------------------------------------
# The INBOX lies beside the archive at the repo root, never inside it, and it has NO subfolders. A
# document nobody can classify does NOT go into an inbox subfolder -- it goes into a node INSIDE the
# archive (`archive/_unsorted/`, which a plan carries a rule for like any other class).
# THE REASON IS MECHANICAL, which is why this is a definition and not a preference: moves WITHIN the
# archive are ordinary work, while a shell move that takes something OUT of it meets
# `guard_fs_tripwire` unless the user has minted an approval for that document (what that guard does
# and does not see is at its own head, not here). Put the clarification node in the inbox and every
# unclear document has to be carried across that line by hand -- a step a real business stopped
# performing within weeks, which is why the boundary is written down here as a definition instead of
# being rediscovered by every project.
#
# -- NOTHING IS DELETED; THERE IS A QUARANTINE (F5) ---------------------------------------------
# A document recognised as superseded, damaged or duplicated moves -- with a logged reason -- into a
# quarantine node inside the archive (`archive/_quarantine/`, again a rule of its own). NOBODY ON
# THE TEAM EMPTIES IT: the quarantine is where a document waits for its owner, and this plan's job is
# only to give it a rule so `gate_filing` lets a document be filed there at all. For business
# documents an erroneous deletion is not repairable, and an agent that may delete will delete
# eventually.
# THAT IS A RULE OF THE TEAM, AND THE WALL UNDER IT IS NARROWER THAN THE RULE. `guard_fs_tripwire`
# refuses shell deletions under `archive/` and shell moves out of it, with one door: an approval the
# USER mints for one document at a time. WHAT IT DOES NOT SEE IT WRITES DOWN ITSELF -- read the
# "WHAT THIS DOES NOT SEE" list at the head of `.claude/hooks/guard_fs_tripwire.py` in your own
# project before you rely on the wall for anything. This file does not repeat that list, because a
# second copy of it here would go on promising whatever the first copy stopped covering.
#
# THIS FILE SHIPS EMPTY, AND AN EMPTY PLAN FILES NOTHING: `gate_filing` fails closed on it, so the
# first document a fresh project meets is refused. That is not a dead end — the manager runs
# `python scripts/filing_plan.py --draft` at onboarding: it derives one proposed rule per document
# class the owner named in `business_profile.yaml` -> `document_sources`, prints the archive TREE
# those rules would produce, and prints the two command lines per rule (`request-approval
# filing_rule` for the question the USER answers, `add-filing-rule` for the write the kernel then
# performs). It writes nothing itself, and it proposes no retention: that number is the user's and
# their Steuerberater's. `python scripts/filing_plan.py --tree` renders the plan as it stands, and
# the same renderer fills the Ablage section of the Verfahrensdokumentation — one tree, never a
# second hand-written copy of the structure (FR-0031).

